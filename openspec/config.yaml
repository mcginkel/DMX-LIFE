schema: spec-driven

context: |
  DMX Life is a Flask web app that controls stage lighting over Art-Net (DMX
  over UDP). One operator runs it from a laptop on the venue LAN, before and
  during live events. Reliability during a show matters more than features.

  Tech stack: Python 3 / Flask, vanilla JavaScript with Jinja templates, no
  build step. All state lives in a single JSON file, app/config.json.

  Key architecture (see docs/adr/ for the reasoning):
  - Scenes are toggleable layers, not a single active scene. The server holds
    the active set and rebuilds the whole 512-channel frame from it on every
    change (ADR-0005).
  - Scenes belong to groups. main/achtergrond/sfeer/aanuit are exclusive
    (one at a time); anything else is additive (ADR-0006).
  - A scene with a non-empty enabledFixtures writes those fixtures' full
    channel ranges including zeros; an empty enabledFixtures means a sparse
    overlay that writes only non-zero channels (ADR-0007).
  - One background thread sends Art-Net continuously at ~30fps and runs the
    fixed 3-second crossfade (ADR-0003, ADR-0004).

  Conventions:
  - DMX channels are 1-based in the UI and config, 0-based in Python arrays.
  - Scene and fixture names are the operator's, often Dutch. Do not rename
    them; they are what the operator reads during a show.
  - API responses are JSON with a success boolean.
  - There are no automated tests. Verify changes by running the app and
    exercising the affected path.
